services:
  migrate:
    build:
      target: development

  backend:
    build:
      target: development
    command:
      - uvicorn
      - app.main:app
      - --app-dir
      - /app/src
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests

  frontend:
    build:
      target: development
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
    ports: !override
      - "5173:5173"

